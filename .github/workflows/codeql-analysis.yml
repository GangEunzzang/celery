name: CodeQL diagnostic

on:
  push:
    branches:
      - diagnostics/codeql-10623-pr
      - diagnostics/codeql-10623-base
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Record source and runner
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^
          python3 --version
          uname -a
          df -h
          free -m
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: python
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.0/codeql-bundle-linux64.tar.gz
          debug: true
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.9
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          output: codeql-results
      - name: Save SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: warn
      - name: Record final resources
        if: always()
        run: |
          df -h
          free -m
